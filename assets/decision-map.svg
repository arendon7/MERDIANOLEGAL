<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Ruta Meridiano</title>
  <desc id="desc">Cinco etapas desde la necesidad hasta el inicio profesional.</desc>
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2c5878"/><stop offset="1" stop-color="#a88454"/></linearGradient></defs>
  <rect width="1000" height="420" rx="28" fill="#f5f1e8"/>
  <path d="M94 210H906" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(100 210)"><circle r="48" fill="#13263a"/><text y="7" font-size="24" fill="#fff">01</text><text y="88" font-size="18" font-weight="700" fill="#13263a">Necesidad</text><text y="113" font-size="13" fill="#5f6870">Qué debe cambiar</text></g>
    <g transform="translate(300 210)"><circle r="48" fill="#1f425d"/><text y="7" font-size="24" fill="#fff">02</text><text y="88" font-size="18" font-weight="700" fill="#13263a">Contexto</text><text y="113" font-size="13" fill="#5f6870">Hechos y actores</text></g>
    <g transform="translate(500 210)"><circle r="48" fill="#2c5878"/><text y="7" font-size="24" fill="#fff">03</text><text y="88" font-size="18" font-weight="700" fill="#13263a">Alcance</text><text y="113" font-size="13" fill="#5f6870">Resultado y límites</text></g>
    <g transform="translate(700 210)"><circle r="48" fill="#8f6b3d"/><text y="7" font-size="24" fill="#fff">04</text><text y="88" font-size="18" font-weight="700" fill="#13263a">Propuesta</text><text y="113" font-size="13" fill="#5f6870">Tiempo e inversión</text></g>
    <g transform="translate(900 210)"><circle r="48" fill="#a88454"/><text y="7" font-size="24" fill="#fff">05</text><text y="88" font-size="18" font-weight="700" fill="#13263a">Inicio</text><text y="113" font-size="13" fill="#5f6870">Aceptación y responsables</text></g>
  </g>
</svg>
