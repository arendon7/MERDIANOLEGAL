<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Ruta Meridiano</title><desc id="desc">Cinco etapas desde comprender la necesidad hasta mantener seguimiento y memoria.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2C5878"/><stop offset="1" stop-color="#A88454"/></linearGradient></defs><rect width="1200" height="430" rx="30" fill="#13263A"/><path d="M108 225C280 80 400 350 585 205S850 85 1085 220" fill="none" stroke="url(#g)" stroke-width="5"/><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><g transform="translate(110 225)"><circle r="45" fill="#F5F1E8" stroke="#A88454" stroke-width="4"/><text y="7" fill="#13263A" font-size="22" font-weight="800">01</text><text y="87" fill="#F5F1E8" font-size="18" font-weight="800">COMPRENDER</text><text y="112" fill="#BFCBD2" font-size="13">contexto y decisión</text></g><g transform="translate(345 170)"><circle r="45" fill="#F5F1E8" stroke="#A88454" stroke-width="4"/><text y="7" fill="#13263A" font-size="22" font-weight="800">02</text><text y="87" fill="#F5F1E8" font-size="18" font-weight="800">CALIFICAR</text><text y="112" fill="#BFCBD2" font-size="13">régimen y evidencia</text></g><g transform="translate(590 220)"><circle r="45" fill="#A88454" stroke="#F5F1E8" stroke-width="4"/><text y="7" fill="#13263A" font-size="22" font-weight="800">03</text><text y="87" fill="#F5F1E8" font-size="18" font-weight="800">ESTRUCTURAR</text><text y="112" fill="#BFCBD2" font-size="13">alcance y entregables</text></g><g transform="translate(835 155)"><circle r="45" fill="#F5F1E8" stroke="#A88454" stroke-width="4"/><text y="7" fill="#13263A" font-size="22" font-weight="800">04</text><text y="87" fill="#F5F1E8" font-size="18" font-weight="800">IMPLEMENTAR</text><text y="112" fill="#BFCBD2" font-size="13">responsables e hitos</text></g><g transform="translate(1085 220)"><circle r="45" fill="#F5F1E8" stroke="#A88454" stroke-width="4"/><text y="7" fill="#13263A" font-size="22" font-weight="800">05</text><text y="87" fill="#F5F1E8" font-size="18" font-weight="800">SEGUIR</text><text y="112" fill="#BFCBD2" font-size="13">riesgo y memoria</text></g></g></svg>
