version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:10"
      timezone: "America/Bogota"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:25"
      timezone: "America/Bogota"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(actions)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
