name: V8.0 W5 Home browser candidate

on:
  pull_request:
    branches: [main]
    paths:
      - assets/data/v8/home-shell-v80.json
      - assets/css/v8/tokens.css
      - assets/css/v8/base.css
      - assets/css/v8/components.css
      - assets/css/v8/surfaces.css
      - assets/js/v8/navigation.js
      - scripts/v8_shell.py
      - scripts/render_v8_home.py
      - scripts/validate_v8_home_shell.py
      - scripts/validate_v8_navigation_shell.py
      - scripts/validate_v8_home_preview.py
      - tests/e2e/v8-home-shell.spec.mjs
      - tests/e2e/v8-home-shell.accessibility.spec.mjs
      - tests/e2e/helpers.mjs
      - playwright.config.mjs
      - package.json
      - package-lock.json
      - index.html
      - firma.html
      - privacidad.html
      - terminos.html
      - aviso-legal.html
      - perspectivas/**
      - productos/**
      - servicios/**
      - sectores/**
      - soluciones/sistema-contractual-empresarial.html
      - practicas/corporativo-societario-gobierno.html
      - servicios-continuos/direccion-juridica-externa.html
      - .github/workflows/v80-home-browser-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v80-w5-home-browser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser and axe on ephemeral W5 Home
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MERIDIANO_BASE_URL: http://127.0.0.1:8000/
    steps:
      - name: Checkout W5 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Validate W5 source contracts before browser
        run: |
          python3 scripts/validate_v8_home_shell.py
          python3 scripts/validate_v8_navigation_shell.py
          python3 scripts/validate_v8_home_preview.py
          python3 scripts/validate_v8_public_tree.py

      - name: Validate test JavaScript syntax
        run: |
          node --check playwright.config.mjs
          node --check tests/e2e/helpers.mjs
          node --check tests/e2e/v8-home-shell.spec.mjs
          node --check tests/e2e/v8-home-shell.accessibility.spec.mjs
          node --check assets/js/v8/navigation.js

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prefer official Ubuntu mirrors for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80meridiano-network >/dev/null

      - name: Install Chromium and WebKit
        run: timeout 900s npx playwright install --with-deps chromium webkit

      - name: Render ephemeral W5 Home
        run: |
          rm -rf .w5-preview
          python3 scripts/render_v8_home.py --output .w5-preview/index.html --prefix ../ --contact-href ../index.html#contacto
          test -s .w5-preview/index.html

      - name: Start local candidate server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/meridiano-w50-home-http.log 2>&1 &
          echo $! > /tmp/meridiano-w50-home-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/.w5-preview/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meridiano-w50-home-http.log >&2 || true
          exit 1

      - name: Run W5 Home Chromium desktop mobile and WebKit suite
        run: >-
          npx playwright test tests/e2e/v8-home-shell.spec.mjs
          --project=chromium-desktop
          --project=chromium-mobile
          --project=webkit-desktop

      - name: Run W5 Home axe accessibility suite
        run: >-
          npx playwright test tests/e2e/v8-home-shell.accessibility.spec.mjs
          --project=accessibility-chromium

      - name: Upload W5 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w50-v8-home-browser-evidence
          path: |
            .w5-preview/index.html
            playwright-report
            test-results
            /tmp/meridiano-w50-home-http.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prove Browser certification did not mutate tracked source
        if: success()
        run: |
          rm -rf .w5-preview playwright-report test-results
          git diff --exit-code
          test -z "$(git status --porcelain)"
