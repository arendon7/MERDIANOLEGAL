name: V6 canonical builder equivalence

on:
  pull_request:
    branches:
      - feat/v6-experience-system
      - fix/v6-canonical-equivalence
    paths:
      - assets/**
      - experience-system-v60.json
      - experience-content-v60.json
      - catalog-products-v41/**
      - catalog-services-v42/**
      - growth-solutions-v51.json
      - scripts/**
      - .github/workflows/build-canonical.yml
      - .github/workflows/v6-canonical-equivalence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v6-canonical-equivalence-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  equivalence:
    name: Reproduce canonical builder through v6 historical stage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout historical candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Preserve historical canonical manifest and v6 invariants
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 scripts/canonical_pipeline_v524.py validate
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_growth_v51.py
          git diff --exit-code
