name: V7 deep offer prototype materializer

on:
  push:
    branches:
      - feat/v700-legal-intelligence-architecture
    paths:
      - assets/data/v7/legal-intelligence-deep-offers-v70.json
      - scripts/apply_legal_intelligence_deep_offers_v70.py
      - scripts/validate_legal_intelligence_deep_offers_v70.py
      - scripts/apply_legal_intelligence_prototype_v70.py
      - scripts/validate_legal_intelligence_prototype_v70.py
      - .github/workflows/v70-deep-offer-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meridiano-v7-deep-offer-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/v700-legal-intelligence-architecture
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Materialize and validate approved v7 prototypes
        run: |
          python3 scripts/apply_legal_intelligence_prototype_v70.py
          python3 scripts/validate_legal_intelligence_v70.py
          python3 scripts/validate_legal_intelligence_prototype_v70.py
      - name: Commit only generated prototype HTML
        run: |
          if git diff --quiet -- servicios/legal-operations.html productos/sistema-contractual-empresarial.html; then
            echo "Deep-offer prototype HTML already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- servicios/legal-operations.html productos/sistema-contractual-empresarial.html
          git commit -m "build(v7): materializa prototipos de ofertas profundas"
          git push origin HEAD:feat/v700-legal-intelligence-architecture
