name: Graphify — memoria estructural Meridiano Legal

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "graphify-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-knowledge:
    name: Construir y validar grafo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Materializar Commercial Evidence v7.4 en branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main "${HEAD_REF}"
          git checkout "${HEAD_REF}"
          python3 scripts/apply_commercial_evidence_v74.py
          python3 scripts/validate_commercial_evidence_v74.py
          python3 scripts/apply_commercial_evidence_v74.py --check
          git checkout origin/main -- .github/workflows/graphify-knowledge.yml
          git add \
            .github/workflows/graphify-knowledge.yml \
            index.html experiencia.html \
            servicios/legal-operations.html \
            productos/sistema-contractual-empresarial.html \
            productos/programa-gobernanza-ia.html \
            productos/proyecto-regulado-estructurado.html \
            soluciones/ordenar-operacion-juridica.html
          if git diff --cached --quiet; then
            echo "Commercial Evidence v7.4 ya estaba materializado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(v7.4): materialize commercial evidence readiness"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

      - name: Instalar uv validado
        run: python -m pip install --disable-pip-version-check "uv==0.12.3"

      - name: Construir Graphify
        env:
          GRAPHIFY_VERSION: "0.9.26"
          GRAPHIFY_FULL_OBSIDIAN: "0"
        run: bash ./scripts/refresh_graphify_knowledge.sh

      - name: Validar memoria estructural y frescura
        run: |
          set -euo pipefail
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/wiki/index.md
          test -s graphify-out/BUILD_META.json
          test -s graphify-out/PROJECT_SNAPSHOT.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          graph = json.loads(Path('graphify-out/graph.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('graphify-out/BUILD_META.json').read_text(encoding='utf-8'))
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', graph.get('links', []))
          wiki = list(Path('graphify-out/wiki').glob('*.md'))
          if not nodes:
              raise SystemExit('grafo vacío')
          if not edges:
              raise SystemExit('grafo sin relaciones')
          if len(wiki) < 2:
              raise SystemExit('wiki vacía')
          if meta.get('source_commit') != os.environ['GITHUB_SHA']:
              raise SystemExit(f"snapshot obsoleto: {meta.get('source_commit')} != {os.environ['GITHUB_SHA']}")
          print(f"Graphify: {len(nodes)} nodos / {len(edges)} relaciones / {len(wiki)} notas wiki / source {meta['source_commit'][:8]}")
          PY

      - name: Publicar snapshot fuera de main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LIVE_BRANCH: "knowledge/graphify-live"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f graphify-out
          git commit -m "chore(graphify): snapshot ${GITHUB_SHA::8} [skip ci]"
          git push --force origin "HEAD:refs/heads/${LIVE_BRANCH}"
