name: Graphify — memoria estructural Meridiano Legal

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "graphify-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-knowledge:
    name: Construir y validar grafo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Instalar uv validado
        run: python -m pip install --disable-pip-version-check "uv==0.12.3"

      - name: Construir Graphify
        env:
          GRAPHIFY_VERSION: "0.9.26"
          GRAPHIFY_FULL_OBSIDIAN: "0"
        run: bash ./scripts/refresh_graphify_knowledge.sh

      - name: Validar memoria estructural y frescura
        run: |
          set -euo pipefail
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/wiki/index.md
          test -s graphify-out/BUILD_META.json
          test -s graphify-out/PROJECT_SNAPSHOT.md
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          graph = json.loads(Path('graphify-out/graph.json').read_text(encoding='utf-8'))
          meta = json.loads(Path('graphify-out/BUILD_META.json').read_text(encoding='utf-8'))
          nodes = graph.get('nodes', [])
          edges = graph.get('edges', graph.get('links', []))
          wiki = list(Path('graphify-out/wiki').glob('*.md'))
          if not nodes:
              raise SystemExit('grafo vacío')
          if not edges:
              raise SystemExit('grafo sin relaciones')
          if len(wiki) < 2:
              raise SystemExit('wiki vacía')
          if meta.get('source_commit') != os.environ['GITHUB_SHA']:
              raise SystemExit(f"snapshot obsoleto: {meta.get('source_commit')} != {os.environ['GITHUB_SHA']}")
          print(f"Graphify: {len(nodes)} nodos / {len(edges)} relaciones / {len(wiki)} notas wiki / source {meta['source_commit'][:8]}")
          PY

      - name: Reconciliar v7 sobre baseline v6.4
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/v700-legal-intelligence-release'
        run: |
          set -euo pipefail
          BRANCH='feat/v700-legal-intelligence-release'
          SOURCE='feat/v700-legal-intelligence-architecture'
          git fetch origin "$BRANCH" "$SOURCE"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          git checkout "origin/$SOURCE" -- \
            assets/data/v7 \
            knowledge/10_DECISIONES/ADR-007-legal-intelligence-architecture-v7.md \
            knowledge/20_ARQUITECTURA/LEGAL-INTELLIGENCE-CONTENT-v7.md \
            knowledge/20_ARQUITECTURA/LEGAL-INTELLIGENCE-MAP-v7.md \
            knowledge/20_DESIGN/LEGAL-INTELLIGENCE-v7-BRIEF.md \
            scripts/apply_ai_governance_360_prototype_v70.py \
            scripts/apply_legal_intelligence_deep_offers_v70.py \
            scripts/apply_legal_intelligence_discovery_v70.py \
            scripts/apply_legal_intelligence_prototype_v70.py \
            scripts/apply_regulatory_control_prototype_v70.py \
            scripts/validate_ai_governance_360_prototype_v70.py \
            scripts/validate_legal_intelligence_deep_offers_v70.py \
            scripts/validate_legal_intelligence_discovery_v70.py \
            scripts/validate_legal_intelligence_prototype_v70.py \
            scripts/validate_legal_intelligence_v70.py \
            scripts/validate_regulatory_control_prototype_v70.py \
            scripts/normalize_experience_compat_v60.py \
            tests/e2e/legal-intelligence-v70.spec.mjs

          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/validate_legal_intelligence_v70.py
          python3 scripts/validate_legal_intelligence_prototype_v70.py
          python3 scripts/validate_legal_intelligence_deep_offers_v70.py
          python3 scripts/validate_ai_governance_360_prototype_v70.py
          python3 scripts/validate_regulatory_control_prototype_v70.py
          python3 scripts/validate_legal_intelligence_discovery_v70.py
          python3 scripts/validate_fit_scope_clarity_v64.py
          python3 scripts/apply_fit_scope_clarity_v64.py --check

          EXPECTED_HTML=$(cat <<'EOF'
          index.html
          productos/programa-gobernanza-ia.html
          productos/proyecto-regulado-estructurado.html
          productos/sistema-contractual-empresarial.html
          servicios/legal-operations.html
          servicios/proyectos-regulados.html
          servicios/tecnologia-inteligencia-artificial.html
          soluciones/estructurar-proyecto-regulado.html
          soluciones/gobernar-inteligencia-artificial-empresa.html
          soluciones/index.html
          soluciones/ordenar-operacion-juridica.html
          EOF
          )
          CHANGED_HTML="$(git diff --name-only -- '*.html' | sort)"
          if [ "$CHANGED_HTML" != "$(printf '%s\n' "$EXPECTED_HTML" | sed 's/^ *//' | sort)" ]; then
            echo 'La reconciliación v7 modificó HTML fuera de las 11 superficies previstas:' >&2
            printf '%s\n' "$CHANGED_HTML" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            assets/data/v7 \
            knowledge/10_DECISIONES/ADR-007-legal-intelligence-architecture-v7.md \
            knowledge/20_ARQUITECTURA/LEGAL-INTELLIGENCE-CONTENT-v7.md \
            knowledge/20_ARQUITECTURA/LEGAL-INTELLIGENCE-MAP-v7.md \
            knowledge/20_DESIGN/LEGAL-INTELLIGENCE-v7-BRIEF.md \
            scripts/apply_ai_governance_360_prototype_v70.py \
            scripts/apply_legal_intelligence_deep_offers_v70.py \
            scripts/apply_legal_intelligence_discovery_v70.py \
            scripts/apply_legal_intelligence_prototype_v70.py \
            scripts/apply_regulatory_control_prototype_v70.py \
            scripts/validate_ai_governance_360_prototype_v70.py \
            scripts/validate_legal_intelligence_deep_offers_v70.py \
            scripts/validate_legal_intelligence_discovery_v70.py \
            scripts/validate_legal_intelligence_prototype_v70.py \
            scripts/validate_legal_intelligence_v70.py \
            scripts/validate_regulatory_control_prototype_v70.py \
            scripts/normalize_experience_compat_v60.py \
            tests/e2e/legal-intelligence-v70.spec.mjs \
            index.html \
            productos/programa-gobernanza-ia.html \
            productos/proyecto-regulado-estructurado.html \
            productos/sistema-contractual-empresarial.html \
            servicios/legal-operations.html \
            servicios/proyectos-regulados.html \
            servicios/tecnologia-inteligencia-artificial.html \
            soluciones/estructurar-proyecto-regulado.html \
            soluciones/gobernar-inteligencia-artificial-empresa.html \
            soluciones/index.html \
            soluciones/ordenar-operacion-juridica.html
          if git diff --cached --quiet; then
            echo 'v7 ya reconciliado sobre v6.4.'
            exit 0
          fi
          git commit -m "feat(v7): reconcile Legal Intelligence with v6.4"
          git push origin HEAD:"$BRANCH"

      - name: Publicar snapshot fuera de main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LIVE_BRANCH: "knowledge/graphify-live"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f graphify-out
          git commit -m "chore(graphify): snapshot ${GITHUB_SHA::8} [skip ci]"
          git push --force origin "HEAD:refs/heads/${LIVE_BRANCH}"
