name: Site Quality and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: meridiano-pages-main
  cancel-in-progress: true

jobs:
  quality:
    name: Validate current site
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Validate HTML, catalog pages and local resources
        run: python3 scripts/validate_site.py
      - name: Validate guided decision flow
        run: python3 scripts/validate_decision_flow.py
      - name: Validate page context and structured data
        run: python3 scripts/validate_page_context.py
      - name: Validate public JavaScript
        run: node --check site-v3.js
      - name: Validate catalog JavaScript
        run: node --check catalog-v32.js
      - name: Validate catalog links
        run: node --check catalog-home-v32.js
      - name: Validate decision flow JavaScript
        run: node --check decision-flow.js
      - name: Validate page context JavaScript
        run: node --check page-context.js
      - name: Validate experience JavaScript
        run: node --check experiencia.js
      - name: Validate demo JavaScript
        run: node --check demo.js
      - name: Validate web manifest
        run: python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Validate version metadata
        run: python3 -m json.tool version.json > /dev/null

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload current repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4

  snapshot:
    name: Update stable snapshot
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Move stable to deployed commit
        run: git push origin HEAD:refs/heads/stable --force
