name: Site Quality and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate HTML, canonical assets and local resources
        run: python3 scripts/validate_site.py
      - name: Validate canonical public JavaScript v3
        run: node --check site-v3.js
      - name: Validate legacy public JavaScript
        run: node --check app.js
      - name: Validate enhancements JavaScript
        run: node --check enhancements.js
      - name: Validate experience JavaScript
        run: node --check experiencia.js
      - name: Validate demo JavaScript
        run: node --check demo.js
      - name: Validate web manifest
        run: python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Validate version metadata
        run: python3 -m json.tool version.json > /dev/null

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
