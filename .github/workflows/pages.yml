name: Site Quality and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
      - site-config.json
      - package.json
      - package-lock.json
      - quality-budgets-v55.json
      - ci-baseline-v56.json
      - release-governance-v57.json
      - .gitignore
      - playwright.config.mjs
      - tests/e2e/**
      - catalog-v32.js
      - catalog-products-v41/**
      - catalog-services-v42/**
      - growth-solutions-v51.json
      - growth-v51.css
      - cro-solutions-v52.json
      - cro-v52.css
      - authority-v53.json
      - measurement-contract-v53.json
      - measurement-v53.js
      - commercial-v43.css
      - commercial-conversion-v44.js
      - ux-v45.css
      - detail-v46.css
      - detail-v46.js
      - editorial-v47.css
      - editorial-v47.js
      - quality-v48.css
      - operations-v49.css
      - telemetry-v50.js
      - visual-v39.css
      - visual-v39.js
      - assets/**
      - scripts/build_catalog_shells.py
      - scripts/render_catalog_static.mjs
      - scripts/render_services_v42.mjs
      - scripts/enrich_editorial_pages.py
      - scripts/apply_commercial_v43.py
      - scripts/apply_visual_assets.py
      - scripts/apply_ux_v45.py
      - scripts/apply_detail_ux_v46.py
      - scripts/apply_editorial_ux_v47.py
      - scripts/normalize_editorial_v47.py
      - scripts/normalize_growth_compat_v51.py
      - scripts/apply_quality_v48.py
      - scripts/normalize_quality_v48.py
      - scripts/apply_operations_v49.py
      - scripts/site_config.py
      - scripts/apply_production_v50.py
      - scripts/validate_production_v50.py
      - scripts/validate_live_v50.py
      - scripts/apply_growth_v51.py
      - scripts/finalize_growth_v51.py
      - scripts/validate_growth_v51.py
      - scripts/validate_live_v51.py
      - scripts/apply_cro_v52.py
      - scripts/validate_cro_v52.py
      - scripts/validate_live_v52.py
      - scripts/apply_authority_v53.py
      - scripts/validate_authority_v53.py
      - scripts/validate_live_v53.py
      - scripts/validate_browser_v54.py
      - scripts/run_quality_v55.mjs
      - scripts/validate_quality_v55.py
      - scripts/summarize_ci_v56.py
      - scripts/validate_ci_v56.py
      - scripts/validate_release_governance_v57.py
      - scripts/validate_operations_v49.py
      - scripts/validate_live_v49.py
      - scripts/sync_public_version.py
      - AGENTS.md
      - .graphifyignore
      - knowledge/**
      - scripts/build_graphify_snapshot.py
      - scripts/refresh_graphify_knowledge.sh
      - .github/workflows/graphify-knowledge.yml
      - .github/workflows/build-canonical.yml
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Build canonical public site"]
    types: [completed]

concurrency:
  group: meridiano-pages-main
  cancel-in-progress: true

jobs:
  quality:
    name: Validate current site
    if: >-
      ${{
        (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           !startsWith(github.event.workflow_run.head_commit.message, 'build: sincroniza sitio público canónico'))) &&
        (github.event_name != 'push' ||
          !startsWith(github.event.head_commit.message, 'build: sincroniza sitio público canónico'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check canonical generators are idempotent
        run: |
          python3 scripts/build_catalog_shells.py
          node scripts/render_catalog_static.mjs
          node scripts/render_services_v42.mjs
          python3 scripts/enrich_editorial_pages.py
          python3 scripts/apply_commercial_v43.py
          python3 scripts/apply_visual_assets.py
          python3 scripts/apply_ux_v45.py
          python3 scripts/apply_detail_ux_v46.py
          python3 scripts/apply_editorial_ux_v47.py
          python3 scripts/normalize_editorial_v47.py
          python3 scripts/normalize_growth_compat_v51.py
          python3 scripts/apply_quality_v48.py
          python3 scripts/normalize_quality_v48.py
          python3 scripts/apply_operations_v49.py
          python3 scripts/sync_public_version.py
          python3 scripts/apply_production_v50.py
          python3 scripts/apply_growth_v51.py
          python3 scripts/finalize_growth_v51.py
          python3 scripts/apply_cro_v52.py
          python3 scripts/apply_authority_v53.py
          git diff --exit-code -- index.html catalog-home-v32.js decision-flow.js site-v3.js page-context.js sitemap.xml robots.txt runtime-config.js site-status.json servicios productos firma.html perspectivas perspectivas.html sectores soluciones experiencia.html demo.html 404.html aviso-legal.html privacidad.html terminos.html manifest.webmanifest CNAME scripts/build_catalog_shells.py
      - name: Validate HTML and local resources
        run: python3 scripts/validate_site.py
      - name: Validate static catalog
        run: python3 scripts/validate_static_catalog.py
      - name: Validate commercial conversion v4.4
        run: python3 scripts/validate_commercial_v44.py
      - name: Validate homepage UX/UI v4.5
        run: python3 scripts/validate_ux_v45.py
      - name: Validate deep-page UX/UI v4.6
        run: python3 scripts/validate_detail_ux_v46.py
      - name: Validate editorial and demo UX/UI v4.7
        run: python3 scripts/validate_editorial_ux_v47.py
      - name: Validate final quality v4.8
        run: python3 scripts/validate_quality_v48.py
      - name: Validate public operations v4.9
        run: python3 scripts/validate_operations_v49.py
      - name: Validate production configuration v5.0
        run: python3 scripts/validate_production_v50.py
      - name: Validate growth and decision routes v5.1
        run: python3 scripts/validate_growth_v51.py
      - name: Validate CRO and search-intent v5.2
        run: python3 scripts/validate_cro_v52.py
      - name: Validate authority, discovery and measurement v5.3
        run: python3 scripts/validate_authority_v53.py
      - name: Validate browser E2E infrastructure v5.4
        run: python3 scripts/validate_browser_v54.py
      - name: Validate performance and accessibility QA v5.5
        run: python3 scripts/validate_quality_v55.py
      - name: Validate CI efficiency and observability v5.6
        run: python3 scripts/validate_ci_v56.py
      - name: Validate release governance v5.7
        run: python3 scripts/validate_release_governance_v57.py
      - name: Validate guided decision flow
        run: python3 scripts/validate_decision_flow.py
      - name: Validate page context and structured data
        run: python3 scripts/validate_page_context.py
      - name: Validate firm, perspectives and sectors
        run: python3 scripts/validate_editorial_context.py
      - name: Validate canonical visual system
        run: python3 scripts/validate_visual_assets.py
      - name: Validate JavaScript
        run: |
          node --check site-v3.js
          node --check catalog-v32.js
          node --check catalog-page.js
          node --check catalog-home-v32.js
          node --check commercial-conversion-v44.js
          node --check decision-flow.js
          node --check page-context.js
          node --check experiencia.js
          node --check demo.js
          node --check visual-v39.js
          node --check detail-v46.js
          node --check editorial-v47.js
          node --check runtime-config.js
          node --check telemetry-v50.js
          node --check measurement-v53.js
          node --check playwright.config.mjs
          node --check tests/e2e/helpers.mjs
          node --check tests/e2e/public-site.spec.mjs
          node --check tests/e2e/demo.spec.mjs
          node --check tests/e2e/accessibility.spec.mjs
          node --check tests/e2e/ci-summary-reporter.mjs
          node --check scripts/run_quality_v55.mjs
          node --check scripts/render_catalog_static.mjs
          node --check scripts/render_services_v42.mjs
      - name: Validate JSON metadata
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null
          python3 -m json.tool version.json > /dev/null
          python3 -m json.tool site-config.json > /dev/null
          python3 -m json.tool site-status.json > /dev/null
          python3 -m json.tool package.json > /dev/null
          python3 -m json.tool package-lock.json > /dev/null
          python3 -m json.tool quality-budgets-v55.json > /dev/null
          python3 -m json.tool ci-baseline-v56.json > /dev/null
          python3 -m json.tool release-governance-v57.json > /dev/null
          python3 -m json.tool growth-solutions-v51.json > /dev/null
          python3 -m json.tool cro-solutions-v52.json > /dev/null
          python3 -m json.tool authority-v53.json > /dev/null
          python3 -m json.tool measurement-contract-v53.json > /dev/null
          for f in catalog-services-v42/*.json; do python3 -m json.tool "$f" > /dev/null; done
          for f in catalog-products-v41/*.json; do python3 -m json.tool "$f" > /dev/null; done

  deploy:
    name: Deploy GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload current repository
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .
      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  live_smoke:
    name: Verify deployed Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MERIDIANO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout deployed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Smoke test public URL
        run: python3 scripts/validate_live_v53.py

  browser_e2e:
    name: Browser E2E on deployed Pages
    needs: [deploy, live_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      MERIDIANO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout deployed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: timeout 360s npx playwright install --with-deps chromium webkit
      - name: Run deployed browser E2E suite
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse_quality:
    name: Lighthouse quality on deployed Pages
    needs: [deploy, live_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      MERIDIANO_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout deployed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Lighthouse Chromium
        run: timeout 180s npx playwright install chromium
      - name: Resolve pinned Lighthouse Chromium
        run: |
          CHROME_BIN="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          if [ ! -x "$CHROME_BIN" ]; then
            echo "No se encontró el Chromium fijado por Playwright." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Run Lighthouse performance and accessibility budgets
        run: npm run audit:quality
      - name: Upload compact Lighthouse summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-quality-summary-v55
          path: |
            quality-artifacts/v5.5/summary.json
            quality-artifacts/v5.5/summary.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Lighthouse failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-quality-failure-artifacts
          path: quality-artifacts
          if-no-files-found: ignore
          retention-days: 7

  snapshot:
    name: Update stable snapshot
    needs: [browser_e2e, lighthouse_quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout deployed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Build CI certification summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-artifacts/v5.6
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > ci-artifacts/v5.6/jobs.json
          MERIDIANO_DEPLOYED_SHA="$(git rev-parse HEAD)" python3 scripts/summarize_ci_v56.py \
            ci-artifacts/v5.6/jobs.json \
            --markdown ci-artifacts/v5.6/summary.md \
            --json ci-artifacts/v5.6/summary.json
          cat ci-artifacts/v5.6/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI certification summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-certification-summary-v56
          path: |
            ci-artifacts/v5.6/summary.md
            ci-artifacts/v5.6/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Build release governance health report
        run: |
          python3 scripts/validate_release_governance_v57.py --report-dir ci-artifacts/v5.7
          cat ci-artifacts/v5.7/release-health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release governance health report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-governance-health-v57
          path: |
            ci-artifacts/v5.7/release-health.md
            ci-artifacts/v5.7/release-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Move stable to deployed commit
        run: git push origin HEAD:refs/heads/stable --force
