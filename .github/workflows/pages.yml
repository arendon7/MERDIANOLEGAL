name: Site Quality and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json
      - catalog-v32.js
      - catalog-products-v41/**
      - catalog-services-v42/**
      - commercial-v43.css
      - visual-v39.css
      - visual-v39.js
      - assets/**
      - scripts/build_catalog_shells.py
      - scripts/render_catalog_static.mjs
      - scripts/render_services_v42.mjs
      - scripts/enrich_editorial_pages.py
      - scripts/apply_commercial_v43.py
      - scripts/sync_public_version.py
      - scripts/apply_visual_assets.py
      - .github/workflows/build-canonical.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Build canonical public site"]
    types: [completed]

concurrency:
  group: meridiano-pages-main
  cancel-in-progress: true

jobs:
  quality:
    name: Validate current site
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Check canonical generators are idempotent
        run: |
          python3 scripts/build_catalog_shells.py
          node scripts/render_catalog_static.mjs
          node scripts/render_services_v42.mjs
          python3 scripts/enrich_editorial_pages.py
          python3 scripts/apply_commercial_v43.py
          python3 scripts/sync_public_version.py
          python3 scripts/apply_visual_assets.py
          git diff --exit-code -- index.html catalog-home-v32.js decision-flow.js servicios productos firma.html perspectivas sectores experiencia.html demo.html manifest.webmanifest scripts/build_catalog_shells.py
      - name: Validate HTML and local resources
        run: python3 scripts/validate_site.py
      - name: Validate static catalog
        run: python3 scripts/validate_static_catalog.py
      - name: Validate commercial system v4.3
        run: python3 scripts/validate_commercial_v43.py
      - name: Validate guided decision flow
        run: python3 scripts/validate_decision_flow.py
      - name: Validate page context and structured data
        run: python3 scripts/validate_page_context.py
      - name: Validate firm, perspectives and sectors
        run: python3 scripts/validate_editorial_context.py
      - name: Validate canonical visual system
        run: python3 scripts/validate_visual_assets.py
      - name: Validate JavaScript
        run: |
          node --check site-v3.js
          node --check catalog-v32.js
          node --check catalog-page.js
          node --check catalog-home-v32.js
          node --check decision-flow.js
          node --check page-context.js
          node --check experiencia.js
          node --check demo.js
          node --check visual-v39.js
          node --check scripts/render_catalog_static.mjs
          node --check scripts/render_services_v42.mjs
      - name: Validate JSON metadata
        run: |
          python3 -m json.tool manifest.webmanifest > /dev/null
          python3 -m json.tool version.json > /dev/null
          for f in catalog-services-v42/*.json; do python3 -m json.tool "$f" > /dev/null; done
          for f in catalog-products-v41/*.json; do python3 -m json.tool "$f" > /dev/null; done

  deploy:
    name: Deploy GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload current repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4

  snapshot:
    name: Update stable snapshot
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout deployed main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Move stable to deployed commit
        run: git push origin HEAD:refs/heads/stable --force
