name: Enrich editorial pages

on:
  push:
    branches: [main]
    paths:
      - scripts/enrich_editorial_pages.py
      - .github/workflows/enrich-editorial.yml
  workflow_dispatch:

concurrency:
  group: meridiano-editorial-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enrich firm, perspectives and sectors
        run: python3 scripts/enrich_editorial_pages.py
      - name: Commit canonical editorial layer
        run: |
          if git diff --quiet; then
            echo "Editorial pages already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firma.html perspectivas sectores
          git commit -m "build: actualiza capa editorial canónica"
          git push origin HEAD:main
