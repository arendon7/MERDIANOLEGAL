name: Temporary v7.2 rematerialize

on:
  push:
    branches:
      - feat/v720-buying-clarity

concurrency:
  group: meridiano-v72-rematerialize-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/v720-buying-clarity
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Materialize and validate
        run: |
          python3 -m py_compile scripts/apply_buying_clarity_v72.py scripts/validate_buying_clarity_v72.py
          python3 scripts/apply_buying_clarity_v72.py
          python3 scripts/validate_buying_clarity_v72.py
          python3 scripts/apply_buying_clarity_v72.py --check
          node --check tests/e2e/buying-clarity-v72.spec.mjs
      - name: Commit canonical HTML and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add productos/*.html servicios/*.html
          git rm .github/workflows/tmp-v72-rematerialize.yml
          git commit -m 'chore(v7.2): rematerialize Buying Clarity after contract fix'
          git push origin HEAD:feat/v720-buying-clarity
