name: V6.5 delivery plan clarity

on:
  pull_request:
    branches: [main]
    paths:
      - version.json
      - catalog-products-v41/**
      - catalog-services-v42/**
      - productos/**
      - servicios/**
      - assets/data/v6/delivery-plan-clarity-v65.json
      - assets/css/v6/delivery-plan-clarity-v65.css
      - scripts/sync_public_version.py
      - scripts/apply_delivery_plan_clarity_v65.py
      - scripts/validate_delivery_plan_clarity_v65.py
      - scripts/apply_experience_v60.py
      - scripts/normalize_experience_compat_v60.py
      - scripts/apply_fit_scope_clarity_v64.py
      - tests/e2e/delivery-plan-clarity-v65.spec.mjs
      - .github/workflows/v65-delivery-plan-clarity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v65-delivery-plan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery_plan:
    name: Delivery plan clarity / canonical truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile v6.5 scripts
        run: python3 -m py_compile scripts/sync_public_version.py scripts/apply_delivery_plan_clarity_v65.py scripts/validate_delivery_plan_clarity_v65.py scripts/apply_experience_v60.py scripts/normalize_experience_compat_v60.py
      - name: Detect delivery plan materialization phase
        run: |
          MATERIALIZED_COUNT="$(grep -l 'data-delivery-plan-clarity-v65="true"' productos/*.html servicios/*.html 2>/dev/null | wc -l | tr -d ' ')"
          case "$MATERIALIZED_COUNT" in
            0)
              echo 'V65_EXPECTED_DELIVERY_DRIFT=16' >> "$GITHUB_ENV"
              echo 'Pre-v6.5 baseline detected: exactly 16 delivery-plan pages must materialize.'
              ;;
            16)
              echo 'V65_EXPECTED_DELIVERY_DRIFT=0' >> "$GITHUB_ENV"
              echo 'Already-materialized v6.5 baseline detected: delivery-plan drift must be zero.'
              ;;
            *)
              echo "Partial Delivery Plan Clarity materialization is invalid: found $MATERIALIZED_COUNT of 16 pages." >&2
              exit 1
              ;;
          esac
      - name: Capture declared release and v6.5 drift
        run: |
          python3 scripts/sync_public_version.py --check > /tmp/release-before.txt 2>&1 || true
          sed -n 's/^- //p' /tmp/release-before.txt | sort -u > /tmp/release-expected.txt
          python3 scripts/apply_delivery_plan_clarity_v65.py --check > /tmp/v65-before.txt 2>&1 || true
          cat /tmp/v65-before.txt
          sed -n 's/^- //p' /tmp/v65-before.txt | sort -u > /tmp/v65-expected.txt
          COUNT="$(sed '/^$/d' /tmp/v65-expected.txt | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne "$V65_EXPECTED_DELIVERY_DRIFT" ]; then
            echo "Delivery Plan Clarity declaró $COUNT fichas pendientes; esta fase exige exactamente $V65_EXPECTED_DELIVERY_DRIFT." >&2
            exit 1
          fi
          if [ "$COUNT" -gt 0 ] && grep -Ev '^(productos|servicios)/[^/]+\.html$' /tmp/v65-expected.txt; then
            echo "Delivery Plan Clarity declaró drift fuera de productos/servicios." >&2
            exit 1
          fi
          cat /tmp/release-expected.txt /tmp/v65-expected.txt | sed '/^$/d' | sort -u > /tmp/v65-total-expected.txt
      - name: Materialize canonical v6 with delivery plan clarity
        run: |
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/apply_fit_scope_clarity_v64.py
          python3 scripts/apply_delivery_plan_clarity_v65.py
      - name: Validate canonical truth and preserved v6 surface
        run: |
          python3 scripts/validate_fit_scope_clarity_v64.py
          python3 scripts/validate_delivery_plan_clarity_v65.py
          python3 scripts/apply_delivery_plan_clarity_v65.py --check
          python3 scripts/sync_public_version.py --check
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_engagement_clarity_v63.py
          python3 scripts/validate_capability_truth_v521.py
      - name: Prove exact first-pass boundary
        run: |
          git diff --name-only | sort -u > /tmp/v65-actual.txt
          if ! diff -u /tmp/v65-total-expected.txt /tmp/v65-actual.txt; then
            echo 'Delivery Plan Clarity first-pass boundary diverged from release drift ∪ phase-exact delivery-plan drift.' >&2
            exit 1
          fi
      - name: Prove second-pass idempotence
        run: |
          git diff > /tmp/v65-pass-1.diff
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/apply_fit_scope_clarity_v64.py
          python3 scripts/apply_delivery_plan_clarity_v65.py
          git diff > /tmp/v65-pass-2.diff
          cmp --silent /tmp/v65-pass-1.diff /tmp/v65-pass-2.diff || {
            echo 'Delivery Plan Clarity materialization is not idempotent.' >&2
            exit 1
          }
          python3 scripts/validate_delivery_plan_clarity_v65.py
          python3 scripts/apply_delivery_plan_clarity_v65.py --check
