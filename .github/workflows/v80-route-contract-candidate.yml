name: V8.0 route contract candidate

on:
  pull_request:
    branches:
      - design/v8-client-architecture-w41
    paths:
      - assets/data/v8/route-contract-v80.json
      - scripts/validate_route_contract_v80.py
      - knowledge/20_DESIGN/V8-ROUTE-COMPATIBILITY-SEO.md
      - knowledge/20_DESIGN/V8-ROUTE-MIGRATION-MATRIX.md
      - knowledge/10_DECISIONES/ADR-008-v8-client-architecture-taxonomy.md
      - knowledge/00_CANON/TAREA_ACTIVA.md
      - sitemap.xml
      - site-config.json
      - '**/*.html'
      - .github/workflows/v80-route-contract-candidate.yml
  workflow_dispatch:

concurrency:
  group: meridiano-v80-route-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate v8 route contract against certified baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile route contract validator
        run: python3 -m py_compile scripts/validate_route_contract_v80.py
      - name: Validate route contract
        run: python3 scripts/validate_route_contract_v80.py
      - name: Preserve canonical pipeline contract
        run: python3 scripts/canonical_pipeline_v524.py validate
