name: V7.3 Legal Intelligence demo candidate

on:
  pull_request:
    branches: [main]
    paths:
      - assets/data/v7/legal-intelligence-demo-v73.json
      - assets/css/v7/legal-intelligence-demo-v73.css
      - experiencia.html
      - catalog-products-v41/**
      - catalog-services-v42/**
      - scripts/apply_legal_intelligence_demo_v73.py
      - scripts/validate_legal_intelligence_demo_v73.py
      - scripts/normalize_experience_compat_v60.py
      - tests/e2e/legal-intelligence-demo-v73.spec.mjs
      - .github/workflows/v73-legal-intelligence-demo-candidate.yml
  workflow_dispatch:

concurrency:
  group: meridiano-v73-li-demo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate source-driven Legal Intelligence demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile v7.3 demo contracts
        run: |
          python3 -m py_compile scripts/apply_legal_intelligence_demo_v73.py scripts/validate_legal_intelligence_demo_v73.py scripts/normalize_experience_compat_v60.py
      - name: Validate materialized demo
        run: |
          python3 scripts/validate_legal_intelligence_demo_v73.py
          python3 scripts/apply_legal_intelligence_demo_v73.py --check
      - name: Validate E2E syntax
        run: node --check tests/e2e/legal-intelligence-demo-v73.spec.mjs
