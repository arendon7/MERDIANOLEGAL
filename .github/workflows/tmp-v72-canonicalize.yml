name: Temporary v7.2 canonicalize exact builder output

on:
  push:
    branches:
      - feat/v720-buying-clarity

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/v720-buying-clarity
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Materialize exact canonical builder chain
        run: |
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/apply_fit_scope_clarity_v64.py
          python3 scripts/validate_buying_clarity_v72.py
          python3 scripts/apply_buying_clarity_v72.py --check
          python3 scripts/apply_fit_scope_clarity_v64.py --check
      - name: Commit exact canonical output and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add productos/*.html servicios/*.html
          git rm .github/workflows/tmp-v72-canonicalize.yml
          git commit -m 'chore(v7.2): freeze exact canonical builder output'
          git push origin HEAD:feat/v720-buying-clarity
