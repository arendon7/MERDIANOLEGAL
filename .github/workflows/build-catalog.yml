name: Build canonical catalog shells

on:
  push:
    branches: [main]
    paths:
      - scripts/build_catalog_shells.py
  workflow_dispatch:

concurrency:
  group: meridiano-catalog-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate canonical shells
        run: python3 scripts/build_catalog_shells.py
      - name: Commit generated catalog when needed
        run: |
          if git diff --quiet -- servicios productos; then
            echo "Catalog shells are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servicios productos
          git commit -m "build: regenera fichas canónicas"
          git push origin HEAD:main
