name: V7 Legal Intelligence prototype materializer

on:
  push:
    branches:
      - feat/v700-legal-intelligence-architecture
    paths:
      - assets/data/v7/legal-intelligence-prototype-v70.json
      - scripts/apply_legal_intelligence_prototype_v70.py
      - scripts/validate_legal_intelligence_prototype_v70.py
      - scripts/validate_legal_intelligence_v70.py
      - .github/workflows/v70-prototype-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meridiano-v7-prototype-materialize
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize one representative v7 surface
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile v7 prototype tooling
        run: python3 -m py_compile scripts/validate_legal_intelligence_v70.py scripts/apply_legal_intelligence_prototype_v70.py scripts/validate_legal_intelligence_prototype_v70.py
      - name: Validate architecture contract
        run: python3 scripts/validate_legal_intelligence_v70.py
      - name: Materialize representative route
        run: python3 scripts/apply_legal_intelligence_prototype_v70.py
      - name: Validate prototype and preserved v6 contracts
        run: |
          python3 scripts/validate_legal_intelligence_prototype_v70.py
          python3 scripts/apply_legal_intelligence_prototype_v70.py --check
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_capability_truth_v521.py
      - name: Commit generated prototype only when valid
        run: |
          if git diff --quiet -- soluciones/ordenar-operacion-juridica.html; then
            echo "Representative prototype already canonical on branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- soluciones/ordenar-operacion-juridica.html
          git commit -m "build(v7): materializa prototipo Legal Intelligence"
          git push origin HEAD:feat/v700-legal-intelligence-architecture
