name: V8.0 W5 home shell candidate

on:
  pull_request:
    branches: [main]
    paths:
      - assets/data/v8/home-shell-v80.json
      - assets/css/v8/components.css
      - assets/css/v8/surfaces.css
      - assets/js/v8/navigation.js
      - scripts/v8_shell.py
      - scripts/render_v8_home.py
      - scripts/validate_v8_home_shell.py
      - scripts/validate_v8_navigation_shell.py
      - scripts/validate_v8_home_preview.py
      - knowledge/20_DESIGN/W50-HOME-NAVIGATION-CONTRACT.md
      - knowledge/10_DECISIONES/ADR-009-v8-w5-home-shell-rc02.md
      - .github/workflows/v80-home-shell-candidate.yml
      - assets/data/v8/route-contract-v80.json
      - assets/data/v8/experience-model-v80.json
      - index.html
      - sitemap.xml
      - soluciones/sistema-contractual-empresarial.html
      - practicas/corporativo-societario-gobierno.html
      - servicios-continuos/direccion-juridica-externa.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v80-w5-home-shell-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate W5 source-driven Home shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout W5 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Compile W5 validators and renderers
        run: |
          python3 -m py_compile \
            scripts/v8_shell.py \
            scripts/render_v8_home.py \
            scripts/validate_v8_home_shell.py \
            scripts/validate_v8_navigation_shell.py \
            scripts/validate_v8_home_preview.py

      - name: Validate W5 Home model and activation boundary
        run: python3 scripts/validate_v8_home_shell.py

      - name: Validate W5 global navigation shell
        run: python3 scripts/validate_v8_navigation_shell.py

      - name: Validate ephemeral W5 Home before materialization
        run: python3 scripts/validate_v8_home_preview.py

      - name: Preserve certified W4.13 public tree
        run: python3 scripts/validate_v8_public_tree.py

      - name: Render ephemeral W5 Home artifact
        run: |
          rm -rf .w5-preview
          python3 scripts/render_v8_home.py --output .w5-preview/index.html --prefix ../ --contact-href ../index.html#contacto
          test -s .w5-preview/index.html
          grep -q 'data-v8-home-shell="candidate"' .w5-preview/index.html
          grep -q 'name="robots" content="noindex,nofollow"' .w5-preview/index.html

      - name: Upload W5 Home preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w50-v8-home-preview
          path: .w5-preview/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Prove validation is non-mutating
        run: |
          rm -rf .w5-preview
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain)"
