name: Release governance health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - version.json
      - site-config.json
      - package.json
      - package-lock.json
      - release-governance-v57.json
      - quality-budgets-v55.json
      - assets/**
      - scripts/**
      - tests/e2e/**
      - '**/*.html'
      - '*.css'
      - '*.js'
  schedule:
    - cron: "41 14 * * 1"

permissions:
  contents: read

concurrency:
  group: meridiano-release-governance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Validate release governance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Require complete final v8 stage on release candidate
        if: github.event_name == 'pull_request'
        run: |
          python3 -m py_compile scripts/run_v8_historical_gate_compat.py scripts/validate_release_governance_v57.py
          test "$(python3 scripts/run_v8_historical_gate_compat.py detect)" = 'v8-final'

      - name: Validate strict historical Growth contract stage-aware
        run: python3 scripts/run_v8_historical_gate_compat.py growth

      - name: Validate supply chain permissions and release topology
        run: |
          python3 scripts/validate_release_governance_v57.py --report-dir governance-artifacts/v5.7
          python3 scripts/validate_pages_trigger_v511.py
          python3 scripts/validate_ci_v56.py

      - name: Validate complete Pages quality contract with dual view
        run: python3 scripts/run_v8_pages_quality_compat.py

      - name: Prove governance validation is non-mutating
        run: git diff --exit-code

      - name: Publish release-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-governance-health-v57
          path: governance-artifacts/v5.7
          if-no-files-found: error
          retention-days: 30
