name: Release governance health

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - version.json
      - site-config.json
      - package.json
      - package-lock.json
      - release-governance-v57.json
      - quality-budgets-v55.json
      - decision-v58.css
      - commercial-intake-v59.json
      - commercial-intake-v59.css
      - commercial-intake-v59.js
      - conversion-close-v510.json
      - conversion-close-v510.css
      - conversion-close-v510.js
      - engagement-v511.css
      - proof-v512.css
      - commercial-brief-v513.css
      - commercial-brief-v513.js
      - recommendation-v514.json
      - recommendation-v514.css
      - recommendation-v514.js
      - decision-action-v515.css
      - decision-action-v515.js
      - handoff-continuity-v517.css
      - handoff-continuity-v517.js
      - handoff-observability-v518.json
      - handoff-observability-v518.js
      - offer-narrative-v522.json
      - offer-v522.css
      - professional-authority-v525.json
      - professional-authority-v525.css
      - visual-assets-v526.json
      - integral-v526.css
      - conversion-path-v528.css
      - funnel-contract-v529.json
      - funnel-observability-v529.js
      - funnel-trust-v529.css
      - offer-commercial-v530.json
      - offer-commercial-v530.css
      - decision-compression-v531.json
      - decision-compression-v531.css
      - assets/decision-map-v526.svg
      - demo.js
      - site-v3.js
      - catalog-products-v41/**
      - catalog-services-v42/**
      - tests/e2e/**
      - scripts/sync_public_version.py
      - scripts/validate_visual_assets.py
      - scripts/apply_decision_v58.py
      - scripts/validate_decision_v58.py
      - scripts/apply_operations_v49.py
      - scripts/apply_commercial_v59.py
      - scripts/validate_commercial_v59.py
      - scripts/apply_conversion_v510.py
      - scripts/validate_conversion_v510.py
      - scripts/apply_engagement_v511.py
      - scripts/validate_engagement_v511.py
      - scripts/apply_proof_v512.py
      - scripts/validate_proof_v512.py
      - scripts/apply_commercial_brief_v513.py
      - scripts/validate_commercial_brief_v513.py
      - scripts/apply_recommendation_v514.py
      - scripts/validate_recommendation_v514.py
      - scripts/apply_decision_action_v515.py
      - scripts/validate_decision_action_v515.py
      - scripts/apply_handoff_v517.py
      - scripts/validate_handoff_v517.py
      - scripts/apply_handoff_observability_v518.py
      - scripts/validate_handoff_observability_v518.py
      - scripts/apply_capability_truth_v521.py
      - scripts/validate_capability_truth_v521.py
      - scripts/apply_offer_narrative_v522.py
      - scripts/validate_offer_narrative_v522.py
      - scripts/apply_contact_compression_v523.py
      - scripts/normalize_contact_compression_v523.py
      - scripts/validate_contact_compression_v523.py
      - scripts/apply_professional_authority_v525.py
      - scripts/validate_professional_authority_v525.py
      - scripts/apply_integral_visual_v526.py
      - scripts/validate_integral_visual_v526.py
      - scripts/apply_conversion_path_v528.py
      - scripts/validate_conversion_path_v528.py
      - scripts/apply_funnel_trust_v529.py
      - scripts/validate_funnel_trust_v529.py
      - scripts/apply_offer_commercial_v530.py
      - scripts/validate_offer_commercial_v530.py
      - scripts/apply_decision_compression_v531.py
      - scripts/validate_decision_compression_v531.py
      - scripts/validate_operations_v49.py
      - scripts/validate_static_catalog.py
      - scripts/validate_growth_v51.py
      - scripts/validate_live_v51.py
      - scripts/validate_quality_v55.py
      - scripts/validate_ci_v56.py
      - scripts/validate_release_governance_v57.py
      - scripts/validate_pages_trigger_v511.py
  schedule:
    - cron: "41 14 * * 1"

permissions:
  contents: read

concurrency:
  group: meridiano-release-governance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Validate release governance
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Normalize materialized handoff v5.17 before historical validators
        run: python3 scripts/apply_handoff_v517.py
      - name: Validate governance contracts
        run: |
          python3 -m py_compile scripts/validate_live_v51.py
          python3 scripts/validate_growth_v51.py
          python3 scripts/validate_quality_v55.py
          python3 scripts/validate_ci_v56.py
          python3 scripts/validate_release_governance_v57.py --report-dir governance-artifacts/v5.7
          python3 scripts/validate_pages_trigger_v511.py
      - name: Validate public version semantics v5.0
        run: |
          python3 scripts/sync_public_version.py
          python3 scripts/validate_production_v50.py
          python3 scripts/validate_visual_assets.py
      - name: Validate buying decision contract v5.8
        run: |
          python3 scripts/apply_decision_v58.py
          python3 scripts/validate_decision_v58.py
      - name: Validate commercial intake contract v5.9
        run: |
          python3 scripts/apply_operations_v49.py
          python3 scripts/apply_decision_v58.py
          python3 scripts/apply_commercial_v59.py
          python3 scripts/validate_commercial_v59.py
      - name: Validate conversion-to-close contract v5.10
        run: |
          python3 scripts/apply_conversion_v510.py
          python3 scripts/validate_conversion_v510.py
      - name: Validate engagement readiness v5.11
        run: |
          python3 scripts/apply_engagement_v511.py
          python3 scripts/validate_engagement_v511.py
      - name: Validate verifiable proof v5.12
        run: |
          python3 scripts/apply_proof_v512.py
          python3 scripts/validate_proof_v512.py
      - name: Validate commercial brief continuity v5.13
        run: |
          python3 scripts/apply_commercial_brief_v513.py
          python3 scripts/validate_commercial_brief_v513.py
      - name: Validate explainable recommendation v5.14
        run: |
          python3 scripts/apply_recommendation_v514.py
          python3 scripts/validate_recommendation_v514.py
      - name: Validate decision-to-action efficiency v5.15
        run: |
          python3 scripts/apply_decision_action_v515.py
          python3 scripts/validate_decision_action_v515.py
      - name: Validate manual handoff continuity v5.17
        run: |
          python3 scripts/apply_handoff_v517.py
          python3 scripts/validate_handoff_v517.py
      - name: Validate handoff observability v5.18+
        run: |
          python3 scripts/apply_handoff_observability_v518.py
          python3 scripts/validate_handoff_observability_v518.py
      - name: Validate offer narrative v5.22
        run: python3 scripts/validate_offer_narrative_v522.py
      - name: Validate contact compression v5.23
        run: python3 scripts/validate_contact_compression_v523.py
      - name: Validate professional authority v5.25
        run: python3 scripts/validate_professional_authority_v525.py
      - name: Validate integral visual simplification v5.26
        run: python3 scripts/validate_integral_visual_v526.py
      - name: Validate conversion path v5.28
        run: python3 scripts/validate_conversion_path_v528.py
      - name: Validate funnel observability and contextual trust v5.29
        run: python3 scripts/validate_funnel_trust_v529.py
      - name: Validate offer commercial depth v5.30
        run: python3 scripts/validate_offer_commercial_v530.py
      - name: Validate decision compression v5.31
        run: python3 scripts/validate_decision_compression_v531.py
      - name: Publish release-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-governance-health-v57
          path: governance-artifacts/v5.7
          if-no-files-found: error
          retention-days: 30
