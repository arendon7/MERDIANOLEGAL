name: Build canonical public site

on:
  push:
    branches: [main]
    paths:
      - version.json
      - site-config.json
      - catalog-v32.js
      - catalog-products-v41/**
      - catalog-services-v42/**
      - growth-solutions-v51.json
      - growth-v51.css
      - cro-solutions-v52.json
      - cro-v52.css
      - commercial-v43.css
      - commercial-conversion-v44.js
      - ux-v45.css
      - detail-v46.css
      - detail-v46.js
      - editorial-v47.css
      - editorial-v47.js
      - quality-v48.css
      - operations-v49.css
      - telemetry-v50.js
      - visual-v39.css
      - visual-v39.js
      - assets/**
      - scripts/build_catalog_shells.py
      - scripts/render_catalog_static.mjs
      - scripts/render_services_v42.mjs
      - scripts/enrich_editorial_pages.py
      - scripts/apply_commercial_v43.py
      - scripts/apply_visual_assets.py
      - scripts/apply_ux_v45.py
      - scripts/apply_detail_ux_v46.py
      - scripts/apply_editorial_ux_v47.py
      - scripts/normalize_editorial_v47.py
      - scripts/normalize_growth_compat_v51.py
      - scripts/apply_quality_v48.py
      - scripts/normalize_quality_v48.py
      - scripts/apply_operations_v49.py
      - scripts/site_config.py
      - scripts/apply_production_v50.py
      - scripts/apply_growth_v51.py
      - scripts/finalize_growth_v51.py
      - scripts/apply_cro_v52.py
      - scripts/sync_public_version.py
      - .github/workflows/build-canonical.yml
  workflow_dispatch:

concurrency:
  group: meridiano-canonical-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate catalog shells
        run: python3 scripts/build_catalog_shells.py
      - name: Pre-render product catalog
        run: node scripts/render_catalog_static.mjs
      - name: Pre-render service catalog v4.2
        run: node scripts/render_services_v42.mjs
      - name: Enrich editorial pages
        run: python3 scripts/enrich_editorial_pages.py
      - name: Apply commercial and conversion system v4.4
        run: python3 scripts/apply_commercial_v43.py
      - name: Apply canonical visual system
        run: python3 scripts/apply_visual_assets.py
      - name: Apply homepage UX/UI v4.5
        run: python3 scripts/apply_ux_v45.py
      - name: Apply deep-page UX/UI v4.6
        run: python3 scripts/apply_detail_ux_v46.py
      - name: Apply editorial and demo UX/UI v4.7
        run: |
          python3 scripts/apply_editorial_ux_v47.py
          python3 scripts/normalize_editorial_v47.py
      - name: Normalize growth compatibility v5.1
        run: python3 scripts/normalize_growth_compat_v51.py
      - name: Apply final quality polish v4.8
        run: |
          python3 scripts/apply_quality_v48.py
          python3 scripts/normalize_quality_v48.py
      - name: Apply public operations v4.9
        run: python3 scripts/apply_operations_v49.py
      - name: Synchronize visible public version
        run: python3 scripts/sync_public_version.py
      - name: Apply production configuration v5.0
        run: python3 scripts/apply_production_v50.py
      - name: Apply growth and decision-entry system v5.1
        run: |
          python3 scripts/apply_growth_v51.py
          python3 scripts/finalize_growth_v51.py
      - name: Apply CRO and search-intent system v5.2
        run: python3 scripts/apply_cro_v52.py
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then
            echo "Canonical public files are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets index.html firma.html perspectivas.html experiencia.html demo.html 404.html aviso-legal.html privacidad.html terminos.html catalog-home-v32.js decision-flow.js site-v3.js page-context.js sitemap.xml robots.txt runtime-config.js site-status.json manifest.webmanifest servicios productos perspectivas sectores soluciones scripts/build_catalog_shells.py
          if [ -e CNAME ] || git ls-files --error-unmatch CNAME >/dev/null 2>&1; then
            git add -A -- CNAME
          fi
          git commit -m "build: sincroniza sitio público canónico"
          git pull --rebase origin main
          git push origin HEAD:main
