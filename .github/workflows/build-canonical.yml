      - scripts/validate_professional_authority_v525.py
      - scripts/apply_integral_visual_v526.py
      - scripts/validate_integral_visual_v526.py
      - scripts/apply_conversion_path_v528.py
      - scripts/validate_conversion_path_v528.py
      - scripts/apply_funnel_trust_v529.py
      - scripts/validate_funnel_trust_v529.py
      - scripts/apply_offer_commercial_v530.py
      - scripts/validate_offer_commercial_v530.py
      - scripts/apply_decision_compression_v531.py
      - scripts/validate_decision_compression_v531.py
      - scripts/apply_experience_v60.py
      - scripts/validate_experience_v60.py
      - scripts/validate_browser_v54.py
      - scripts/run_quality_v55.mjs
      - scripts/validate_quality_v55.py
      - scripts/summarize_ci_v56.py
      - scripts/validate_ci_v56.py
      - scripts/validate_release_governance_v57.py
      - scripts/validate_pages_trigger_v511.py
      - scripts/sync_public_version.py
      - .github/workflows/build-canonical.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: meridiano-canonical-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Generate QA dependency lockfile v5.5+
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate catalog shells
        run: python3 scripts/build_catalog_shells.py
      - name: Pre-render product catalog
        run: node scripts/render_catalog_static.mjs
      - name: Pre-render service catalog v4.2
        run: node scripts/render_services_v42.mjs
      - name: Enrich editorial pages
        run: python3 scripts/enrich_editorial_pages.py
      - name: Apply commercial and conversion system v4.4
        run: python3 scripts/apply_commercial_v43.py
      - name: Apply canonical visual system
        run: python3 scripts/apply_visual_assets.py
      - name: Apply homepage UX/UI v4.5
        run: python3 scripts/apply_ux_v45.py
      - name: Apply deep-page UX/UI v4.6
        run: python3 scripts/apply_detail_ux_v46.py
      - name: Apply editorial and demo UX/UI v4.7
        run: |
          python3 scripts/apply_editorial_ux_v47.py
          python3 scripts/normalize_editorial_v47.py
      - name: Normalize growth compatibility v5.1
        run: python3 scripts/normalize_growth_compat_v51.py
      - name: Apply final quality polish v4.8
        run: |
          python3 scripts/apply_quality_v48.py
          python3 scripts/normalize_quality_v48.py
      - name: Apply public operations v4.9
        run: python3 scripts/apply_operations_v49.py
      - name: Synchronize visible public version
        run: python3 scripts/sync_public_version.py
      - name: Apply production configuration v5.0
        run: python3 scripts/apply_production_v50.py
      - name: Apply growth and decision-entry system v5.1
        run: |
          python3 scripts/apply_growth_v51.py
          python3 scripts/finalize_growth_v51.py
      - name: Apply CRO and search-intent system v5.2
        run: python3 scripts/apply_cro_v52.py
      - name: Apply authority, discovery and measurement system v5.3
        run: python3 scripts/apply_authority_v53.py
      - name: Apply buying decision architecture v5.8
        run: python3 scripts/apply_decision_v58.py
      - name: Apply commercial intake and proposal handoff v5.9
        run: python3 scripts/apply_commercial_v59.py
      - name: Apply conversion-to-close architecture v5.10
        run: python3 scripts/apply_conversion_v510.py
      - name: Apply engagement readiness v5.11
        run: python3 scripts/apply_engagement_v511.py
      - name: Apply verifiable proof and modality guidance v5.12
        run: python3 scripts/apply_proof_v512.py
      - name: Apply commercial brief continuity v5.13
        run: python3 scripts/apply_commercial_brief_v513.py
      - name: Apply explainable modality recommendation v5.14
        run: python3 scripts/apply_recommendation_v514.py
      - name: Apply decision-to-action efficiency v5.15
        run: python3 scripts/apply_decision_action_v515.py
      - name: Apply manual handoff continuity v5.17
        run: python3 scripts/apply_handoff_v517.py
      - name: Apply handoff observability and Experience System v6
        run: |
          python3 scripts/apply_handoff_observability_v518.py
          python3 scripts/apply_experience_v60.py
      - name: Commit canonical outputs
        run: |
          if git diff --quiet; then
            echo "Canonical public files are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package-lock.json assets index.html firma.html perspectivas.html experiencia.html demo.html demo.js 404.html aviso-legal.html privacidad.html terminos.html catalog-home-v32.js decision-flow.js site-v3.js page-context.js sitemap.xml robots.txt runtime-config.js site-status.json manifest.webmanifest servicios productos perspectivas sectores soluciones scripts/build_catalog_shells.py
          if [ -e CNAME ] || git ls-files --error-unmatch CNAME >/dev/null 2>&1; then
            git add -A -- CNAME
          fi
          git commit -m "build: sincroniza sitio público canónico"
          git pull --rebase origin main
          git push origin HEAD:main
