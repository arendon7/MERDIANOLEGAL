name: V6 candidate validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v6-candidate-validation.yml
      - .github/workflows/v6-live-release-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v6-candidate-diag-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic_marker:
    name: Diagnostic branch marker
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm isolated diagnostic branch
        run: echo "Temporary diagnostic branch; canonical candidate workflow remains unchanged on main."
