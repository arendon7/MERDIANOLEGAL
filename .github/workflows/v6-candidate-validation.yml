name: V6 candidate validation

on:
  pull_request:
    branches: [main]
    paths:
      - version.json
      - experience-system-v60.json
      - experience-content-v60.json
      - growth-solutions-v51.json
      - cro-solutions-v52.json
      - catalog-products-v41/**
      - catalog-services-v42/**
      - assets/css/v6/**
      - funnel-observability-v529.js
      - scripts/enrich_editorial_pages.py
      - scripts/apply_experience_v60.py
      - scripts/apply_experience_solutions_v60.py
      - scripts/apply_experience_sectors_v60.py
      - scripts/apply_experience_perspectives_v60.py
      - scripts/apply_experience_final_v60.py
      - scripts/normalize_experience_compat_v60.py
      - scripts/apply_funnel_trust_v529.py
      - scripts/validate_experience_v60.py
      - scripts/validate_experience_solutions_v60.py
      - scripts/validate_experience_sectors_v60.py
      - scripts/validate_experience_perspectives_v60.py
      - scripts/validate_experience_final_v60.py
      - scripts/validate_funnel_trust_v529.py
      - scripts/validate_proof_v512.py
      - scripts/validate_capability_truth_v521.py
      - scripts/validate_editorial_context.py
      - .github/workflows/build-canonical.yml
      - .github/workflows/v6-candidate-validation.yml
      - index.html
      - perspectivas.html
      - firma.html
      - experiencia.html
      - demo.html
      - aviso-legal.html
      - privacidad.html
      - terminos.html
      - 404.html
      - productos/**
      - servicios/**
      - soluciones/**
      - sectores/**
      - perspectivas/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v6-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Materialize and validate v6 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect candidate baseline phase
        id: phase
        run: |
          if grep -q 'data-experience-system="v6"' index.html; then
            echo 'is_v6=true' >> "$GITHUB_OUTPUT"
            echo 'Candidate starts from an already-materialized v6 baseline; zero first-pass changes are valid.'
          else
            echo 'is_v6=false' >> "$GITHUB_OUTPUT"
            echo 'Candidate starts from a pre-v6 baseline; first-pass materialization must produce public changes.'
          fi
      - name: Compile v6 renderers and validators
        run: python3 -m py_compile scripts/apply_experience_v60.py scripts/apply_experience_solutions_v60.py scripts/apply_experience_sectors_v60.py scripts/apply_experience_perspectives_v60.py scripts/apply_experience_final_v60.py scripts/normalize_experience_compat_v60.py scripts/validate_experience_v60.py scripts/validate_experience_solutions_v60.py scripts/validate_experience_sectors_v60.py scripts/validate_experience_perspectives_v60.py scripts/validate_experience_final_v60.py scripts/validate_proof_v512.py
      - name: Materialize first v6 pass
        run: |
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
      - name: Validate v6 surface contracts
        run: |
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_experience_sectors_v60.py
          python3 scripts/validate_experience_perspectives_v60.py
          python3 scripts/validate_experience_final_v60.py
      - name: Validate preserved historical contracts
        run: |
          python3 scripts/validate_funnel_trust_v529.py
          python3 scripts/validate_proof_v512.py
          python3 scripts/validate_capability_truth_v521.py
          python3 scripts/validate_editorial_context.py
      - name: Capture first materialized diff
        run: |
          git diff -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas > /tmp/v6-pass-1.diff
          if [ "${{ steps.phase.outputs.is_v6 }}" != "true" ] && [ ! -s /tmp/v6-pass-1.diff ]; then
            echo "A pre-v6 candidate must materialize at least one public v6 surface." >&2
            exit 1
          fi
          if [ -s /tmp/v6-pass-1.diff ]; then
            echo "First pass materialized public candidate changes."
          else
            echo "First pass is already canonical on the v6 baseline."
          fi
      - name: Prove second-pass idempotence
        run: |
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_experience_sectors_v60.py
          python3 scripts/validate_experience_perspectives_v60.py
          python3 scripts/validate_experience_final_v60.py
          python3 scripts/validate_funnel_trust_v529.py
          python3 scripts/validate_proof_v512.py
          python3 scripts/validate_capability_truth_v521.py
          python3 scripts/validate_editorial_context.py
          git diff -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas > /tmp/v6-pass-2.diff
          if ! cmp --silent /tmp/v6-pass-1.diff /tmp/v6-pass-2.diff; then
            echo "Experience System v6 dejó de ser idempotente:" >&2
            diff -u /tmp/v6-pass-1.diff /tmp/v6-pass-2.diff || true
            exit 1
          fi
          echo "Experience System v6 is idempotent across all 46 public surfaces."
      - name: Verify scoped v6 materialization boundary
        run: |
          CHANGED="$(git diff --name-only -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas)"
          printf '%s\n' "$CHANGED"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(index\.html|perspectivas\.html|firma\.html|experiencia\.html|demo\.html|aviso-legal\.html|privacidad\.html|terminos\.html|404\.html|productos/[^/]+\.html|servicios/[^/]+\.html|soluciones/[^/]+\.html|sectores/[^/]+\.html|perspectivas/[^/]+\.html)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "El renderer v6 modificó archivos públicos fuera de las 46 superficies certificadas:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"
          MIN=0
          if [ "${{ steps.phase.outputs.is_v6 }}" != "true" ]; then MIN=1; fi
          if [ "$COUNT" -lt "$MIN" ] || [ "$COUNT" -gt 46 ]; then
            echo "La materialización debe modificar entre $MIN y 46 superficies para esta fase; encontró $COUNT." >&2
            exit 1
          fi
          echo "Scoped materialization OK: $COUNT superficie(s) cambiada(s); cobertura estructural 46/46 validada por los validators."
      - name: Diagnostic probe of current public Pages release
        env:
          MERIDIANO_BASE_URL: https://arendon7.github.io/MERDIANOLEGAL/
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          url = f"https://arendon7.github.io/MERDIANOLEGAL/site-status.json?diag={time.time_ns()}"
          req = Request(url, headers={"User-Agent":"MeridianoReleaseProbe/6.0","Cache-Control":"no-cache"})
          with urlopen(req, timeout=20) as response:
              body = response.read().decode("utf-8", errors="replace")
          print("CACHE_BUSTED_SITE_STATUS=", body)
          print("CACHE_BUSTED_VERSION=", json.loads(body).get("version"))
          PY
          python3 scripts/validate_live_v53.py

  public_browser_probe:
    name: Diagnostic Browser E2E on public v6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MERIDIANO_BASE_URL: https://arendon7.github.io/MERDIANOLEGAL/
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prefer official Ubuntu mirrors for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80meridiano-network >/dev/null
      - name: Install Chromium and WebKit
        run: timeout 900s npx playwright install --with-deps chromium webkit
      - name: Run public browser E2E suite
        run: npm run test:e2e
      - name: Upload diagnostic browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostic-public-browser-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

  public_lighthouse_probe:
    name: Diagnostic Lighthouse on public v6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERIDIANO_BASE_URL: https://arendon7.github.io/MERDIANOLEGAL/
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Lighthouse Chromium
        run: timeout 180s npx playwright install chromium
      - name: Resolve pinned Lighthouse Chromium
        run: |
          CHROME_BIN="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          if [ ! -x "$CHROME_BIN" ]; then
            echo "No se encontró el Chromium fijado por Playwright." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Run Lighthouse quality budgets
        run: npm run audit:quality
      - name: Upload diagnostic Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostic-public-lighthouse
          path: quality-artifacts
          if-no-files-found: ignore
          retention-days: 3
