name: V6 candidate validation

on:
  pull_request:
    branches: [main]
    paths:
      - version.json
      - site-config.json
      - sitemap.xml
      - robots.txt
      - experience-system-v60.json
      - experience-content-v60.json
      - growth-solutions-v51.json
      - cro-solutions-v52.json
      - catalog-products-v41/**
      - catalog-services-v42/**
      - assets/**
      - funnel-observability-v529.js
      - scripts/sync_public_version.py
      - scripts/apply_search_discovery_v62.py
      - scripts/validate_search_discovery_v62.py
      - scripts/apply_engagement_clarity_v63.py
      - scripts/validate_engagement_clarity_v63.py
      - scripts/validate_production_v50.py
      - scripts/enrich_editorial_pages.py
      - scripts/apply_experience_v60.py
      - scripts/apply_experience_solutions_v60.py
      - scripts/apply_experience_sectors_v60.py
      - scripts/apply_experience_perspectives_v60.py
      - scripts/apply_experience_final_v60.py
      - scripts/normalize_experience_compat_v60.py
      - scripts/apply_funnel_trust_v529.py
      - scripts/validate_experience_v60.py
      - scripts/validate_experience_solutions_v60.py
      - scripts/validate_experience_sectors_v60.py
      - scripts/validate_experience_perspectives_v60.py
      - scripts/validate_experience_final_v60.py
      - scripts/validate_funnel_trust_v529.py
      - scripts/validate_proof_v512.py
      - scripts/validate_capability_truth_v521.py
      - scripts/validate_editorial_context.py
      - .github/workflows/build-canonical.yml
      - .github/workflows/v6-candidate-validation.yml
      - index.html
      - perspectivas.html
      - firma.html
      - experiencia.html
      - demo.html
      - aviso-legal.html
      - privacidad.html
      - terminos.html
      - 404.html
      - productos/**
      - servicios/**
      - soluciones/**
      - sectores/**
      - perspectivas/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v6-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Materialize and validate v6 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect candidate baseline phase
        id: phase
        run: |
          if grep -q 'data-experience-system="v6"' index.html; then
            echo 'is_v6=true' >> "$GITHUB_OUTPUT"
            echo 'Candidate starts from an already-materialized v6 baseline; zero first-pass HTML changes are valid.'
          else
            echo 'is_v6=false' >> "$GITHUB_OUTPUT"
            echo 'Candidate starts from a pre-v6 baseline; first-pass materialization must produce public changes.'
          fi
      - name: Compile v6 renderers and validators
        run: python3 -m py_compile scripts/sync_public_version.py scripts/apply_search_discovery_v62.py scripts/validate_search_discovery_v62.py scripts/apply_engagement_clarity_v63.py scripts/validate_engagement_clarity_v63.py scripts/validate_production_v50.py scripts/apply_experience_v60.py scripts/apply_experience_solutions_v60.py scripts/apply_experience_sectors_v60.py scripts/apply_experience_perspectives_v60.py scripts/apply_experience_final_v60.py scripts/normalize_experience_compat_v60.py scripts/validate_experience_v60.py scripts/validate_experience_solutions_v60.py scripts/validate_experience_sectors_v60.py scripts/validate_experience_perspectives_v60.py scripts/validate_experience_final_v60.py scripts/validate_proof_v512.py
      - name: Materialize first v6 pass
        run: |
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
      - name: Validate v6 surface contracts
        run: |
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_experience_sectors_v60.py
          python3 scripts/validate_experience_perspectives_v60.py
          python3 scripts/validate_experience_final_v60.py
          if [ -f assets/data/v6/search-discovery-readiness-v62.json ]; then
            python3 scripts/validate_search_discovery_v62.py
            python3 scripts/apply_search_discovery_v62.py --check
          fi
          if [ -f assets/data/v6/engagement-clarity-v63.json ]; then
            python3 scripts/validate_engagement_clarity_v63.py
            python3 scripts/apply_engagement_clarity_v63.py --check
          fi
      - name: Validate preserved historical contracts
        run: |
          python3 scripts/validate_production_v50.py
          python3 scripts/validate_funnel_trust_v529.py
          python3 scripts/validate_proof_v512.py
          python3 scripts/validate_capability_truth_v521.py
          python3 scripts/validate_editorial_context.py
      - name: Capture first materialized diff
        run: |
          git diff -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas catalog-home-v32.js decision-flow.js runtime-config.js site-status.json sitemap.xml robots.txt > /tmp/v6-pass-1.diff
          if [ "${{ steps.phase.outputs.is_v6 }}" != "true" ] && [ ! -s /tmp/v6-pass-1.diff ]; then
            echo "A pre-v6 candidate must materialize at least one public v6 surface." >&2
            exit 1
          fi
          if [ -s /tmp/v6-pass-1.diff ]; then
            echo "First pass materialized candidate changes, including release/discovery/engagement metadata when required."
          else
            echo "First pass is already canonical on the v6 baseline."
          fi
      - name: Prove second-pass idempotence
        run: |
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/validate_production_v50.py
          python3 scripts/validate_experience_v60.py
          python3 scripts/validate_experience_solutions_v60.py
          python3 scripts/validate_experience_sectors_v60.py
          python3 scripts/validate_experience_perspectives_v60.py
          python3 scripts/validate_experience_final_v60.py
          python3 scripts/validate_funnel_trust_v529.py
          python3 scripts/validate_proof_v512.py
          python3 scripts/validate_capability_truth_v521.py
          python3 scripts/validate_editorial_context.py
          if [ -f assets/data/v6/search-discovery-readiness-v62.json ]; then
            python3 scripts/validate_search_discovery_v62.py
            python3 scripts/apply_search_discovery_v62.py --check
          fi
          if [ -f assets/data/v6/engagement-clarity-v63.json ]; then
            python3 scripts/validate_engagement_clarity_v63.py
            python3 scripts/apply_engagement_clarity_v63.py --check
          fi
          git diff -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas catalog-home-v32.js decision-flow.js runtime-config.js site-status.json sitemap.xml robots.txt > /tmp/v6-pass-2.diff
          if ! cmp --silent /tmp/v6-pass-1.diff /tmp/v6-pass-2.diff; then
            echo "Experience System v6 dejó de ser idempotente:" >&2
            diff -u /tmp/v6-pass-1.diff /tmp/v6-pass-2.diff || true
            exit 1
          fi
          echo "Experience System v6 and public release/discovery/engagement metadata are idempotent."
      - name: Verify scoped v6 HTML materialization boundary
        run: |
          CHANGED="$(git diff --name-only -- index.html perspectivas.html firma.html experiencia.html demo.html aviso-legal.html privacidad.html terminos.html 404.html productos servicios soluciones sectores perspectivas)"
          printf '%s\n' "$CHANGED"
          UNEXPECTED="$(printf '%s\n' "$CHANGED" | grep -Ev '^(index\.html|perspectivas\.html|firma\.html|experiencia\.html|demo\.html|aviso-legal\.html|privacidad\.html|terminos\.html|404\.html|productos/[^/]+\.html|servicios/[^/]+\.html|soluciones/[^/]+\.html|sectores/[^/]+\.html|perspectivas/[^/]+\.html)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "El renderer v6 modificó HTML fuera de las 46 superficies certificadas:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi
          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"
          MIN=0
          if [ "${{ steps.phase.outputs.is_v6 }}" != "true" ]; then MIN=1; fi
          if [ "$COUNT" -lt "$MIN" ] || [ "$COUNT" -gt 46 ]; then
            echo "La materialización HTML debe modificar entre $MIN y 46 superficies para esta fase; encontró $COUNT." >&2
            exit 1
          fi
          echo "Scoped HTML materialization OK: $COUNT superficie(s) cambiada(s); cobertura estructural 46/46 validada."