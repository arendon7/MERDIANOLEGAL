name: V7.2 buying clarity candidate

on:
  pull_request:
    branches: [main]
    paths:
      - assets/data/v7/buying-clarity-v72.json
      - assets/css/v7/buying-clarity-v72.css
      - catalog-products-v41/**
      - catalog-services-v42/**
      - productos/**
      - servicios/**
      - scripts/apply_buying_clarity_v72.py
      - scripts/validate_buying_clarity_v72.py
      - scripts/normalize_experience_compat_v60.py
      - tests/e2e/buying-clarity-v72.spec.mjs
      - knowledge/20_DESIGN/BUYING-CLARITY-v72.md
      - .github/workflows/v72-buying-clarity-candidate.yml
  workflow_dispatch:

concurrency:
  group: meridiano-v72-buying-clarity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate source-driven Buying Clarity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile v7.2 materializer and validator
        run: |
          python3 -m py_compile scripts/apply_buying_clarity_v72.py scripts/validate_buying_clarity_v72.py scripts/normalize_experience_compat_v60.py
      - name: Validate materialized Buying Clarity
        run: |
          python3 scripts/validate_buying_clarity_v72.py
          python3 scripts/apply_buying_clarity_v72.py --check
      - name: Validate E2E syntax
        run: node --check tests/e2e/buying-clarity-v72.spec.mjs
      - name: Diagnose canonical rebuild ordering
        run: |
          target='productos/diagnostico-juridico-empresarial.html'
          cp "$target" /tmp/v72-original.html
          python3 scripts/sync_public_version.py
          python3 scripts/apply_experience_v60.py
          python3 scripts/apply_experience_solutions_v60.py
          python3 scripts/apply_experience_sectors_v60.py
          python3 scripts/apply_experience_perspectives_v60.py
          python3 scripts/apply_experience_final_v60.py
          python3 scripts/apply_funnel_trust_v529.py
          python3 scripts/normalize_experience_compat_v60.py
          if [ -f assets/data/v6/fit-scope-clarity-v64.json ]; then
            python3 scripts/apply_fit_scope_clarity_v64.py
          fi
          cp "$target" /tmp/v72-rebuilt.html
          echo '--- candidate vs canonical rebuild (first 220 lines) ---'
          diff -u /tmp/v72-original.html /tmp/v72-rebuilt.html | head -220 || true
          python3 scripts/apply_engagement_clarity_v63.py
          echo '--- canonical rebuild vs engagement reapply (first 220 lines) ---'
          diff -u /tmp/v72-rebuilt.html "$target" | head -220 || true
