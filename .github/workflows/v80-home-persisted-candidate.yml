name: V8.0 W5.0E persisted Home candidate

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/render_v8_home_persisted.py
      - scripts/validate_v8_home_persisted.py
      - assets/css/v8/home-persisted.css
      - assets/js/v8/contact.js
      - assets/js/v8/measurement.js
      - tests/e2e/v8-home-persisted.spec.mjs
      - tests/e2e/v8-home-persisted.accessibility.spec.mjs
      - scripts/render_v8_home.py
      - scripts/v8_shell.py
      - assets/data/v8/home-shell-v80.json
      - assets/css/v8/**
      - assets/js/v8/navigation.js
      - runtime-config.js
      - assets/js/v6/analytics-adapter-v61.js
      - index.html
      - .github/workflows/v80-home-persisted-candidate.yml
      - knowledge/20_DESIGN/W50E-PERSISTED-HOME-CANDIDATE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meridiano-v80-w50e-persisted-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Future root / Chromium mobile WebKit axe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MERIDIANO_BASE_URL: http://127.0.0.1:8000/
    steps:
      - name: Checkout W5.0E candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Compile future-root contracts
        run: |
          python3 -m py_compile scripts/render_v8_home_persisted.py scripts/validate_v8_home_persisted.py
          node --check assets/js/v8/contact.js
          node --check assets/js/v8/measurement.js
          node --check tests/e2e/v8-home-persisted.spec.mjs
          node --check tests/e2e/v8-home-persisted.accessibility.spec.mjs

      - name: Validate exact future-root contract before browser
        run: |
          python3 scripts/validate_v8_home_shell.py
          python3 scripts/validate_v8_navigation_shell.py
          python3 scripts/validate_v8_public_tree.py
          python3 scripts/validate_v8_home_persisted.py

      - name: Materialize exact future root in disposable mirror
        run: |
          SITE_ROOT=/tmp/meridiano-w50e-site
          rm -rf "$SITE_ROOT"
          mkdir -p "$SITE_ROOT"
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./playwright-report' \
            --exclude='./test-results' \
            --exclude='./.w5-persisted' \
            -cf - . | tar -xf - -C "$SITE_ROOT"
          python3 scripts/render_v8_home_persisted.py --output "$SITE_ROOT/index.html"
          test -s "$SITE_ROOT/index.html"
          grep -q 'data-v8-home-candidate="persisted"' "$SITE_ROOT/index.html"
          grep -q 'name="robots" content="index,follow,max-image-preview:large"' "$SITE_ROOT/index.html"
          grep -q 'rel="canonical" href="https://arendon7.github.io/MERDIANOLEGAL/"' "$SITE_ROOT/index.html"
          test "$(grep -o 'id="contact-form"' "$SITE_ROOT/index.html" | wc -l)" -eq 1
          test -s "$SITE_ROOT/runtime-config.js"
          test -s "$SITE_ROOT/assets/js/v8/contact.js"
          test -s "$SITE_ROOT/assets/css/v8/home-persisted.css"

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prefer official Ubuntu mirrors for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80meridiano-network >/dev/null

      - name: Install Chromium and WebKit
        run: timeout 900s npx playwright install --with-deps chromium webkit

      - name: Start disposable future-root server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory /tmp/meridiano-w50e-site > /tmp/meridiano-w50e-http.log 2>&1 &
          echo $! > /tmp/meridiano-w50e-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/meridiano-w50e-http.log >&2 || true
          exit 1

      - name: Run future-root browser suite
        run: >-
          npx playwright test tests/e2e/v8-home-persisted.spec.mjs
          --project=chromium-desktop
          --project=chromium-mobile
          --project=webkit-desktop

      - name: Run future-root axe suite
        run: >-
          npx playwright test tests/e2e/v8-home-persisted.accessibility.spec.mjs
          --project=accessibility-chromium

      - name: Prove E1 did not persist or mutate production Home
        run: |
          rm -rf playwright-report test-results
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Prepare W5.0E failure evidence
        if: failure()
        run: |
          mkdir -p .w5-persisted-evidence
          cp /tmp/meridiano-w50e-site/index.html .w5-persisted-evidence/index.html 2>/dev/null || true
          cp /tmp/meridiano-w50e-http.log .w5-persisted-evidence/http.log 2>/dev/null || true

      - name: Upload W5.0E browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w50e-persisted-home-failure
          path: |
            .w5-persisted-evidence
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
