name: Temporary v7.2 wire normalizer

on:
  push:
    branches:
      - feat/v720-buying-clarity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/v720-buying-clarity
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Wire Buying Clarity into canonical compatibility normalizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/normalize_experience_compat_v60.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def normalize_engagement_clarity() -> None:\n'
          block = '''def normalize_buying_clarity_v72() -> None:\n    contract = ROOT / "assets" / "data" / "v7" / "buying-clarity-v72.json"\n    if not contract.exists():\n        return\n    run_contract_script("apply_buying_clarity_v72.py", "Buying Clarity v7.2")\n    run_contract_script("validate_buying_clarity_v72.py", "Buying Clarity v7.2")\n\n\n'''
          if 'def normalize_buying_clarity_v72()' not in text:
              if marker not in text:
                  raise SystemExit('No se encontró ancla de Engagement Clarity')
              text = text.replace(marker, block + marker, 1)
          main_old = '    normalize_legal_intelligence_discovery()\n    normalize_engagement_clarity()\n'
          main_new = '    normalize_legal_intelligence_discovery()\n    normalize_engagement_clarity()\n    normalize_buying_clarity_v72()\n'
          if '    normalize_buying_clarity_v72()\n' not in text:
              if main_old not in text:
                  raise SystemExit('No se encontró ancla de main')
              text = text.replace(main_old, main_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/normalize_experience_compat_v60.py scripts/apply_buying_clarity_v72.py scripts/validate_buying_clarity_v72.py
          python3 scripts/normalize_experience_compat_v60.py
          python3 scripts/validate_buying_clarity_v72.py
          python3 scripts/apply_buying_clarity_v72.py --check
      - name: Commit normalizer integration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/normalize_experience_compat_v60.py productos/*.html servicios/*.html
          git rm .github/workflows/tmp-v72-wire-normalizer.yml
          git commit -m 'fix(v7.2): preserve buying clarity through canonical rebuilds'
          git push origin HEAD:feat/v720-buying-clarity
